site_name: Logistics Marketplace — Architecture
site_description: Reference architecture for an event-driven marketplace logistics platform.
site_author: Leandro Flora
site_url: https://leandrosflora.github.io/logistica-marketplace-demo-arch/
repo_name: leandrosflora/logistica-marketplace-demo-arch
repo_url: https://github.com/leandrosflora/logistica-marketplace-demo-arch
edit_uri: edit/main/docs/

# Keep the repository source layout intact while the MkDocs hook stages
# translated Portuguese pages as *.pt.md so English can remain the default
# language at the site root.
hooks:
  - scripts/mkdocs_english_default.py

# MkDocs builds from a temporary i18n staging directory created by the hook.
# Keep the original docs tree under live-reload observation.
watch:
  - docs

theme:
  name: material
  language: en
  icon:
    logo: material/truck-fast-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - pt
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          site_name: Logística Marketplace — Arquitetura
          site_description: Arquitetura de referência para uma plataforma de logística de marketplace orientada a eventos.
          nav_translations:
            Home: Início
            Architecture: Arquitetura
            Service map: Mapa de serviços
            Data and ownership: Dados e ownership
            Security: Segurança
            Glossary: Glossário
            C4 diagrams: Diagramas C4
            Context: Contexto
            Containers: Containers
            Checkout: Checkout
            Order: Pedido
            Order saga: Saga de pedido
            Shipping promise: Promessa de entrega
            Shipment: Entrega
            Tracking: Rastreio
            Contracts: Contratos
            Overview: Visão geral
            REST APIs: APIs REST
            OpenAPI: OpenAPI
            Kafka events: Eventos Kafka
            Schema governance: Governança de schemas
            Services: Serviços
            Journeys: Jornadas
            Main journey: Jornada principal
            Search and quote: Busca e cotação
            Checkout confirmation: Confirmação do checkout
            Reservation saga: Saga de reservas
            Tracking and notification: Rastreio e notificação
            Decisions: Decisões
            EDA: EDA
            Saga Orchestrator: Saga Orchestrator
            Hexagonal Architecture: Arquitetura Hexagonal
            Kafka versioning: Versionamento Kafka
            Idempotency: Idempotência
            Observability: Observabilidade
            Saga topics: Tópicos da saga
            Operations: Operação
            CI/CD: CI/CD
            Pipeline: Pipeline
            Deployment: Deployment
            Environments: Ambientes
            Runbooks: Runbooks
            Local Kafka E2E: Kafka local E2E
            Local observability: Observabilidade local
            Local Order Visibility: Order Visibility local

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Architecture:
      - Service map: contracts/services-map.md
      - Data and ownership: contracts/data-stores.md
      - Security: security/security-architecture.md
      - Glossary: glossary/domain-glossary.md
      - C4 diagrams:
          - Context: c4/logistica-envios-context.svg
          - Containers: c4/logistica-envios-container.svg
          - Checkout: c4/logistica-envios-checkout-domain-level3.svg
          - Order: c4/logistica-envios-order-domain-level3.svg
          - Order saga: c4/logistica-envios-order-saga-level3.svg
          - Shipping promise: c4/logistica-envios-shipping-promise-domain-level3.svg
          - Shipment: c4/logistica-envios-shipment-domain-level3.svg
          - Tracking: c4/logistica-envios-tracking-domain-level3.svg
  - Contracts:
      - Overview: contracts/README.md
      - REST APIs: contracts/api-contract-validation.md
      - OpenAPI: contracts/logistica-envios-apis.openapi.yaml
      - Kafka events: contracts/kafka-events.md
      - Schema governance: contracts/kafka-schema-governance.md
  - Services:
      - Product Search: services/product-search-service.md
      - Product Catalog: services/product-catalog-service.md
      - Checkout: services/checkout-service.md
      - Shipping Promise: services/shipping-promise-service.md
      - Shipping Pricing: services/shipping-pricing-service.md
      - Inventory: services/inventory-service.md
      - Fulfillment Center: services/fulfillment-center-service.md
      - Routing: services/routing-service.md
      - Carrier: services/carrier-service.md
      - Order: services/order-service.md
      - Payment: services/payment-service.md
      - Shipment: services/shipment-service.md
      - Tracking: services/tracking-service.md
      - Notification: services/notification-service.md
      - Audit: services/audit-service.md
      - Order Visibility: services/order-visibility-service.md
  - Journeys:
      - Overview: sequence-diagrams/README.md
      - Main journey: sequence-diagrams/00-overview-shipping-journey-happy-path.svg
      - Search and quote: sequence-diagrams/01-product-search-and-quote-happy-path.svg
      - Checkout confirmation: sequence-diagrams/02-checkout-confirmation-and-order-created.svg
      - Reservation saga: sequence-diagrams/03-order-saga-reservations-and-shipment-happy-path.svg
      - Tracking and notification: sequence-diagrams/04-tracking-and-notification-happy-path.svg
  - Decisions:
      - EDA: adr/0001-use-event-driven-architecture.md
      - Saga Orchestrator: adr/0002-saga-orchestrator-pattern.md
      - Hexagonal Architecture: adr/0003-hexagonal-clean-architecture.md
      - Kafka versioning: adr/0004-kafka-schema-versioning.md
      - Idempotency: adr/0005-idempotency-strategy.md
      - Observability: adr/0006-observability-stack.md
      - Saga topics: adr/0007-order-service-internal-saga-topics.md
  - Operations:
      - CI/CD: devops/ci-cd.md
      - Pipeline: cicd/pipeline.md
      - Deployment: devops/deployment.md
      - Environments: devops/environments.md
      - Observability: devops/observability.md
      - Security: devops/security.md
      - Runbooks:
          - Local Kafka E2E: runbooks/kafka-local-e2e.md
          - Local observability: runbooks/observability-local.md
          - Local Order Visibility: runbooks/order-visibility-local.md

